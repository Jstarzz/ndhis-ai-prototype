services:
  agent:
    image: ndhis-westmere-agent:local
    build:
      context: ./services/legacy-agent
      args:
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-b10797}
    ipc: private
    security_opt: []
    cap_add: []
    shm_size: 1gb
    environment:
      OPENBLAS_NUM_THREADS: ${WESTMERE_AGENT_BATCH_THREADS:-12}
      OMP_NUM_THREADS: ${WESTMERE_AGENT_BATCH_THREADS:-12}
      OMP_PLACES: cores
      OMP_PROC_BIND: ${WESTMERE_OMP_PROC_BIND:-spread}
      MALLOC_ARENA_MAX: "2"
    volumes:
      - ${WESTMERE_MODEL_ROOT:-./models}/cpu/agent:/models/agent:ro
    command:
      - --model
      - /models/agent/${AGENT_MODEL_FILE:-Qwen3.5-4B-Q4_K_M.gguf}
      - --alias
      - ${AGENT_MODEL_NAME:-ndhis-agent-westmere}
      - --ctx-size
      - ${AGENT_MAX_MODEL_LEN:-2048}
      - --parallel
      - ${WESTMERE_AGENT_PARALLEL:-1}
      - --threads
      - ${WESTMERE_AGENT_THREADS:-6}
      - --threads-batch
      - ${WESTMERE_AGENT_BATCH_THREADS:-12}
      - --batch-size
      - ${WESTMERE_AGENT_BATCH_SIZE:-2048}
      - --ubatch-size
      - ${WESTMERE_AGENT_UBATCH_SIZE:-512}
      - --numa
      - ${WESTMERE_AGENT_NUMA:-distribute}
      - --load-mode
      - ${WESTMERE_AGENT_LOAD_MODE:-mmap}
      - --cache-reuse
      - ${WESTMERE_AGENT_CACHE_REUSE:-0}
      - --prio
      - ${WESTMERE_AGENT_PRIO:-0}
      - --poll
      - ${WESTMERE_AGENT_POLL:-50}
      - --sleep-idle-seconds
      - "${WESTMERE_AGENT_SLEEP_IDLE_SECONDS:--1}"
      - --spec-type
      - ${WESTMERE_AGENT_SPEC_TYPE:-none}
      - --warmup
      - --cache-prompt
      - --cache-ram
      - "0"
      - --no-cache-idle-slots
      - --perf
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --jinja

  translation-engine:
    volumes:
      - ${WESTMERE_MODEL_ROOT:-./models}/cpu/translation:/models/translation:ro

  translation:
    volumes:
      - ${WESTMERE_MODEL_ROOT:-./models}/cpu/asr:/models/asr:ro
      - ./data:/data

  forecasting:
    build:
      context: ./services/forecasting
      dockerfile: Dockerfile.westmere
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      FORECAST_MODEL_PATH: /models/forecast
      FORECAST_DEVICE: cpu
      FORECAST_BACKEND: ridge
      FORECAST_DATA_PATH: /data/synthetic_hospital.csv
      FORECAST_MODEL_NAME: ${FORECAST_MODEL_NAME:-autoregressive-ridge}
      FORECAST_HISTORY_DAYS: ${FORECAST_HISTORY_DAYS:-2557}
      FORECAST_RIDGE_ALPHA: ${FORECAST_RIDGE_ALPHA:-10}
      FORECAST_MAX_POINTS: ${FORECAST_MAX_POINTS:-2000}
    volumes:
      - ./data:/data

  radiology:
    build:
      context: ./services/radiology
      dockerfile: Dockerfile.westmere
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      RADIOLOGY_MODEL_PATH: /models/radiology
      RADIOLOGY_MODEL_NAME: ${RADIOLOGY_MODEL_NAME:-lung-cxr-densenet-pipeline-v1}
      RADIOLOGY_BACKEND: opencv_onnx_lung_pipeline
      RADIOLOGY_DEVICE: cpu
      RADIOLOGY_PIPELINE_SIZE: ${RADIOLOGY_PIPELINE_SIZE:-256}
      RADIOLOGY_SEGMENTATION_FILE: ${RADIOLOGY_SEGMENTATION_FILE:-lung-segmentation.onnx}
      RADIOLOGY_SCREENING_FILE: ${RADIOLOGY_SCREENING_FILE:-healthy-unhealthy-densenet.onnx}
      RADIOLOGY_DISEASE_FILE: ${RADIOLOGY_DISEASE_FILE:-disease-densenet.onnx}
      RADIOLOGY_SEGMENTATION_THRESHOLD: ${RADIOLOGY_SEGMENTATION_THRESHOLD:-0.5}
      RADIOLOGY_SCREENING_THRESHOLD: ${RADIOLOGY_SCREENING_THRESHOLD:-0.91}
      RADIOLOGY_OPENCV_THREADS: ${RADIOLOGY_OPENCV_THREADS:-6}
      RADIOLOGY_MAX_UPLOAD_MB: ${RADIOLOGY_MAX_UPLOAD_MB:-32}
      RADIOLOGY_MAX_RESULTS: ${RADIOLOGY_MAX_RESULTS:-100}
    volumes:
      - ${WESTMERE_MODEL_ROOT:-./models}/westmere/radiology:/models/radiology:ro

  gateway:
    environment:
      DEMO_API_KEY: ${DEMO_API_KEY:-ndhis-local-demo}
      RUNTIME_PROFILE: westmere
      AGENT_URL: http://agent:8000/v1/chat/completions
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-ndhis-agent-westmere}
      AGENT_MODEL_LABEL: "${AGENT_MODEL_LABEL:-Qwen3.5-4B Q4_K_M}"
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-128}
      AGENT_ROUTER_MAX_TOKENS: ${AGENT_ROUTER_MAX_TOKENS:-40}
      AGENT_ASSISTANT_MAX_TOKENS: ${AGENT_ASSISTANT_MAX_TOKENS:-96}
      AGENT_STARTUP_WARMUP: ${AGENT_STARTUP_WARMUP:-1}
      AGENT_STARTUP_WARMUP_TIMEOUT_SECONDS: ${AGENT_STARTUP_WARMUP_TIMEOUT_SECONDS:-60}
      ASR_MODEL_NAME: ${ASR_MODEL_NAME:-faster-whisper-base}
      TRANSLATION_MODEL_NAME: ${TRANSLATION_MODEL_NAME:-translatepsy-euronano-tiny}
      FORECAST_MODEL_NAME: ${FORECAST_MODEL_NAME:-autoregressive-ridge}
      RADIOLOGY_MODEL_NAME: ${RADIOLOGY_MODEL_NAME:-lung-cxr-densenet-pipeline-v1}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-30}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-2}
      MAX_BODY_MB: ${MAX_BODY_MB:-40}
      TRANSLATION_URL: ws://translation:8101/ws/translate
      FORECAST_URL: http://forecasting:8102
      RADIOLOGY_URL: http://radiology:8103
      AUDIT_PATH: /data/audit.jsonl
